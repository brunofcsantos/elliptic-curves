[package]
name = "signing_example"
version = "0.1.0"
edition = "2021"

[dependencies]
p256 = { path = "../p256", features = ["ecdsa", "sha256"] }
p384 = { path = "../p384", features = ["ecdsa", "sha2"] }
p521 = { path = "../p521", features = ["ecdsa", "sha512"] }
rand_core = "0.9"
rand = "0.9"
hex = "0.4"
criterion = "0.6.0"
nix = { version = "0.30.1", features = ["sched", "process"] }
hex-literal = "1.0.0"

[[bench]]
name = "p256"
harness = false
path = "benches/p256.rs"

[[bench]]
name = "p384"
harness = false
path = "benches/p384.rs"

[[bench]]
name = "p521"
harness = false
path = "benches/p521.rs"

[[bin]]
name = "create_keys_p256"
path = "src/create_keys_p256.rs"

[[bin]]
name = "create_keys_p384"
path = "src/create_keys_p384.rs"

[[bin]]
name = "create_keys_p521"
path = "src/create_keys_p521.rs"